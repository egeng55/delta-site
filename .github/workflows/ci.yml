name: Site CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delta-site-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_DELTA_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_DELTA_LOCAL_DEMO: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Run preflight
        run: npm run agent:preflight

      - name: Run safety scan
        run: npm run agent:safety-scan

      - name: Run deterministic evals
        run: npm run agent:eval

      - name: Run tests
        run: npm test -- --runInBand

      - name: Run lint
        run: npm run lint

      - name: Build production site
        run: npm run build
